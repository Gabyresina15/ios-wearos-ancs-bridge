name: AncsBridgeIOS
options:
  bundleIdPrefix: com.ancsbridge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: AncsBridgeIOS/Info.plist

targets:
  AncsBridgeIOS:
    type: application
    platform: iOS
    sources:
      - path: AncsBridgeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ancsbridge.ios
        PRODUCT_NAME: AncsBridgeIOS
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: AncsBridgeIOS/AncsBridgeIOS.entitlements
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: HealthKit.framework
      - sdk: AVFoundation.framework
      - sdk: EventKit.framework
      - sdk: UserNotifications.framework
